<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="브리핑 쉬기">
<meta name="mobile-web-app-capable" content="yes">
<title>브리핑 쉬기</title>
<style>
:root{--bg:#f6f4f1;--card:#fff;--ink:#1f2328;--sub:#5b6470;--accent:#c2410c;--ok:#15803d;--err:#b91c1c}
@media (prefers-color-scheme:dark){:root{--bg:#14110f;--card:#1f1b18;--ink:#f1ece6;--sub:#b3aba2;--accent:#fb923c;--ok:#4ade80;--err:#f87171}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;display:flex;align-items:center;justify-content:center;padding:20px}
.box{width:100%;max-width:420px}
h1{font-size:20px;margin:0 0 6px}p.s{color:var(--sub);font-size:14px;margin:0 0 20px;line-height:1.5}
button{width:100%;border:0;border-radius:18px;padding:22px 16px;font-size:20px;font-weight:800;color:#fff;background:var(--accent);margin-bottom:12px;font-family:inherit}
button.alt{background:var(--card);color:var(--ink);font-size:16px;font-weight:700;padding:16px;border:1px solid #8884}
button:disabled{opacity:.5}
#msg{min-height:48px;font-size:15px;line-height:1.5;margin:6px 2px 14px}
.ok{color:var(--ok)}.err{color:var(--err)}
input{width:100%;padding:14px;font-size:16px;border-radius:12px;border:1px solid #8886;background:var(--card);color:var(--ink);margin-bottom:10px}
.link{background:none;border:0;color:var(--sub);font-size:13px;font-weight:400;text-decoration:underline;padding:8px;margin:8px 0 0}
</style></head>
<body><div class="box">
<h1>☕ 아침 브리핑 쉬기</h1>
<p class="s">누르면 <b>다음에 오는 아침 브리핑</b>을 쉬어요. 자정이 지나도 OK. 06:43 전까지 누르면 돼요.</p>

<div id="setup" hidden>
  <p class="s">처음 한 번만 열쇠(토큰)를 붙여넣어 주세요. 이 폰의 브라우저에만 저장돼요.</p>
  <input id="tok" type="password" placeholder="github_pat_..." autocomplete="off" autocapitalize="off" spellcheck="false">
  <button id="save">저장하고 시작</button>
</div>

<div id="main" hidden>
  <button id="skip">😴 내일 아침 브리핑 쉬기</button>
  <button id="undo" class="alt">☕ 다시 받기 (쉬기 취소)</button>
  <div id="msg"></div>
  <button id="reset" class="link">열쇠 다시 입력</button>
</div>
</div>
<script>
const REPO = "dough-man/morning-briefing", WF = "skip.yml", KEY = "briefing_skip_token";
const $ = id => document.getElementById(id);
const get = () => { try { return localStorage.getItem(KEY) } catch (e) { return null } };
const set = v => { try { v ? localStorage.setItem(KEY, v) : localStorage.removeItem(KEY) } catch (e) {} };

function show() {
  const has = !!get();
  $("setup").hidden = has; $("main").hidden = !has;
}
function say(t, cls) { $("msg").textContent = t; $("msg").className = cls || ""; }

async function run(mode) {
  const tok = get(); if (!tok) return show();
  $("skip").disabled = $("undo").disabled = true; say("요청 중…");
  try {
    const r = await fetch(`https://api.github.com/repos/${REPO}/actions/workflows/${WF}/dispatches`, {
      method: "POST",
      headers: { "Authorization": "Bearer " + tok, "Accept": "application/vnd.github+json",
                 "X-GitHub-Api-Version": "2022-11-28", "Content-Type": "application/json" },
      body: JSON.stringify({ ref: "main", inputs: { dates: "내일아침", mode } })
    });
    if (r.status === 204) say(mode === "쉬기"
      ? "✅ 요청했어요! 곧 카톡으로 '쉬기 등록' 확인 메시지가 와요."
      : "✅ 요청했어요! 곧 카톡으로 '다시 받기' 확인 메시지가 와요.", "ok");
    else if (r.status === 401 || r.status === 403 || r.status === 404)
      say("열쇠가 맞지 않거나 만료됐어요. 아래 '열쇠 다시 입력'으로 새로 넣어주세요. (" + r.status + ")", "err");
    else say("실패했어요 (" + r.status + "). 잠시 뒤 다시 시도해 주세요.", "err");
  } catch (e) { say("네트워크 오류예요. 연결을 확인해 주세요.", "err"); }
  $("skip").disabled = $("undo").disabled = false;
}
$("skip").onclick = () => run("쉬기");
$("undo").onclick = () => run("취소");
$("save").onclick = () => { const v = $("tok").value.trim(); if (v) { set(v); $("tok").value = ""; show(); } };
$("reset").onclick = () => { set(null); say(""); show(); };
show();
</script>
</body></html>
